<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneySmart - Create Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .mobile-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .app-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .app-logo {
            color: #2d3748;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .app-tagline {
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 30px 25px;
            width: 100%;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .form-title {
            color: #2d3748;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .form-subtitle {
            color: #718096;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-weight: 500;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background-color: #f8fafc;
        }
        
        input:focus {
            outline: none;
            border-color: #4299e1;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }
        
        .btn {
            background: linear-gradient(to right, #4299e1, #667eea);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 153, 225, 0.4);
        }
        
        .signin-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #718096;
        }
        
        .signin-link a {
            color: #4299e1;
            text-decoration: none;
            font-weight: 500;
        }
        
        .signin-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }
            
            .form-title {
                font-size: 20px;
            }
            
            input {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="app-header">
            <div class="app-logo">MoneySmart</div>
            <div class="app-tagline">Your Smart Finance Companion</div>
        </div>
        
        <div class="card">
            <div class="form-header">
                <h2 class="form-title">Create Account</h2>
                <p class="form-subtitle">Start your smart finance journey</p>
            </div>
            
            <form>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                </div>
                
                <button type="submit" class="btn">Create Account</button>
                
                <div class="signin-link">
                    Already have an account? <a href="#">Sign in</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
